[platformio]
src_dir = firmware

[env:esp32dev]
platform = platformio/espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -DWOKWI_SIMULATION=1
lib_deps =
    adafruit/Adafruit MPU6050@2.2.9
    https://github.com/spaziochirale/Chirale_TensorFlowLite.git#46da2f989205a9216229d38cd3d1c657d79d6781
